<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Extreme Honeymoons - Graphics</title>

<style>


	#thumbs, #image {
		width: 900px;
		text-align: center;
		margin: 0 auto 0 auto;
		color: #000;
	}

	#thumbs {
		margin-top: 10px;
	}

			
	#thumbs img {
		border: solid 1px #000;
		margin: 5px;
	}

	#image{
		height:500px;
	}

	.instructions{
		font-style:italic;
	}

</style>

<script type="text/javascript">
	var PrintButton1 = new Image();
	var PrintButton2 = new Image();
	var logo1 = new Image();
	var logo2 = new Image();
 
	PrintButton1.src = "images/print1.png";
	PrintButton2.src = "images/print2.png";
	logo1.src = "images/logo1.png";
	logo2.src = "images/logo2.png";
	function rollOver(imgID, newSrc) {
		document.getElementById(imgID).src = newSrc;
	}
 


		var imgArray = new Array(
			'Image1Lg.jpg',
			'Image2Lg.jpg',
			'Image3Lg.jpg',
			'Image4Lg.jpg'
			

		);


		var titleArray = new Array(
			'Couple hiking by a stream',
			'Snowshoeing in the Backcountry',
			'Sunset Over the Water',
			'Mountain Biking the High Country'
			
		);
			
		var imgPath = "images/fullsize/";
		
		function swapImage(imgID) {

			var theImage = document.getElementById('theImage');
			var textDiv = document.getElementById('bottomText');

			var newImg;
			var textTitle;

			newImg = imgArray[imgID];
			theImage.src = imgPath + newImg;

			textTitle=titleArray[imgID];

      			textDiv.innerHTML = textTitle;
		}
			
		function preloadImages() {		
			for(var i = 0; i < imgArray.length; i++) {
				var tmpImg = new Image;
				tmpImg.src = imgPath + imgArray[i];
			}
		}
		

</script>


</head>
<body  onload="preloadImages()">
<div style="text-align: center;">
<div>
	<a href=""
	   onmouseover="rollOver('PrintButton', 'images/print2.png');"
	   onmouseout="rollOver('PrintButton', 'images/print1.png');">
	<img src="images/print1.png" width="200" height="50"
	     id="PrintButton" alt="Print this page" style="border:none;" />
	</a>
</div>
<div>
<a href=""
	   onmouseover="rollOver('logo', 'images/logo2.png');"
	   onmouseout="rollOver('logo', 'images/logo1.png');">
	<img src="images/logo1.png" width="150" height="175"
	     id="logo" alt="Extreme Honeymoons logo" style="border:none;" />
	</a>
</div>

<br />
<br />
<br />
<br />


<div id="thumbs">
		<img src="images/thumbnails/Image1Sm.jpg" alt="Couple hiking by a stream" onmouseover="swapImage(0);" />
		<img src="images/thumbnails/Image2Sm.jpg" alt="Snowshoeing in the mountains" onmouseover="swapImage(1);" />
		<img src="images/thumbnails/Image3Sm.jpg" alt="Sunset over the water" onmouseover="swapImage(2);" />
		<img src="images/thumbnails/Image4Sm.jpg" alt="Mountain biking" onmouseover="swapImage(3);" />
		
</div>

	<div id="image">

		<img id="theImage" src="images/fullsize/Image1Lg.jpg" alt="Couple hiking by a stream" />
		<h3 id="bottomText">Couple Biking Through a Mountain Stream</h3>
	</div>

<img src="images/2colback.jpg" alt="Two column background image" />

<br />
<br />
<br />
<br />



</div>

  

</body>
</html>
