<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Site Design - Color Palette</title>
<style type="text/css">
body{
	font-family: Arial, Helvetica, sans-serif;
	background-color: #F5F8EE;
	color: #2A331C;
}
h1{
	color: #2E5916;
}
table{
	border-collapse: collapse;
}
td, th{
	border: 1px solid #2A331C;
	padding: 10px;
}
</style>
</head>
<body>

<h1>Butterflies and Moths - Color Palette</h1>

<p>Color scheme selected using paletton.com (Analogic scheme, light background)</p>

<table>
	<tr>
		<th>Use</th>
		<th>Hex Value</th>
		<th>Sample</th>
	</tr>
	<tr>
		<td>Page Background</td>
		<td>#F5F8EE</td>
		<td style="background-color: #F5F8EE;">Sample</td>
	</tr>
	<tr>
		<td>Page Text</td>
		<td>#2A331C</td>
		<td style="background-color: #2A331C; color: #FFFFFF;">Sample</td>
	</tr>
	<tr>
		<td>Headings</td>
		<td>#2E5916</td>
		<td style="background-color: #2E5916; color: #FFFFFF;">Sample</td>
	</tr>
	<tr>
		<td>Link</td>
		<td>#38691C</td>
		<td style="background-color: #38691C; color: #FFFFFF;">Sample</td>
	</tr>
	<tr>
		<td>Visited Link</td>
		<td>#7A5C1E</td>
		<td style="background-color: #7A5C1E; color: #FFFFFF;">Sample</td>
	</tr>
	<tr>
		<td>Hover Link</td>
		<td>#C25E1B</td>
		<td style="background-color: #C25E1B; color: #FFFFFF;">Sample</td>
	</tr>
</table>

</body>
</html>
